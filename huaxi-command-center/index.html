<!doctype html>

<html lang="zh-CN">

  <head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#f0f4f8" />

    <title>登录 · 华西县域急危重症救治指挥中心</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link

      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap"

      rel="stylesheet"

    />

    <link rel="stylesheet" href="/assets/theme/theme-light.css" />

    <!-- INJECT_BACKEND_ENV -->

    <script src="/assets/backend/backend-api-config.js"></script>

    <script src="/assets/backend/backend-api-bridge.js?v=11"></script>

  </head>

  <body class="hx-login-page-body">

    <div class="hx-login-shell">

      <aside class="hx-login-brand" aria-hidden="false">

        <div class="hx-login-brand__inner">

          <div class="hx-login-brand__mark" aria-hidden="true">

            <span class="hx-login-brand__icon"></span>

          </div>

          <p class="hx-login-brand__eyebrow">WEST CHINA · COUNTY EMERGENCY</p>

          <h1 class="hx-login-brand__title">县域急危重症救治<br />一体化指挥中心</h1>

          <p class="hx-login-brand__desc">

            院前急救、远程会诊、转诊协同与质控闭环统一入口。请使用授权账号登录。

          </p>

          <ul class="hx-login-brand__features">

            <li>全县一张网调度</li>

            <li>基层上转与会诊</li>

            <li>多院协同质控</li>

          </ul>

        </div>

        <div class="hx-login-brand__glow" aria-hidden="true"></div>

      </aside>



      <main class="hx-login-panel">

        <section class="hx-login-page-card">

          <header class="hx-login-page-header">

            <h2>欢迎登录</h2>

            <p>华西合作县域指挥平台</p>

          </header>

          <form id="hx-login-form" class="hx-login-page-form" autocomplete="on">

            <label class="hx-auth-login-field">

              <span>账号</span>

              <input

                name="username"

                type="text"

                required

                autocomplete="username"

                placeholder="请输入账号"

              />

            </label>

            <label class="hx-auth-login-field">

              <span>密码</span>

              <input

                name="password"

                type="password"

                required

                autocomplete="current-password"

                placeholder="请输入密码"

              />

            </label>

            <label class="hx-auth-login-remember">

              <input name="remember" type="checkbox" checked />

              <span>记住账号（不保存密码）</span>

            </label>

            <button type="button" id="hx-login-fill-demo" class="hx-auth-login-btn hx-login-fill-demo">
              填充后端演示账号
            </button>

            <p id="hx-login-status" class="hx-login-status" aria-live="polite"></p>

            <p id="hx-login-error" class="hx-auth-login-error" hidden></p>

            <button type="submit" class="hx-auth-login-btn primary hx-login-page-submit">登录系统</button>

          </form>

        </section>

        <p class="hx-login-panel__copy">© 县域急危重症救治一体化指挥平台</p>

      </main>

    </div>

    <script src="/assets/backend/login-page.js?v=8"></script>

  </body>

</html>
